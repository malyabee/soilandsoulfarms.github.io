<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Soil & Soul Order Processing</title>

<style>
body { font-family: Arial; margin:20px; }
h1 { color:#2e7d32; }

.section { margin-bottom:20px; }

.label {
  border:2px solid #2e7d32;
  padding:10px;
  margin:5px;
  width:260px;
}

#labels { display:flex; flex-wrap:wrap; }

</style>
</head>

<body>

<h1>🌱 Soil & Soul Order Tool</h1>

<div class="section">
<input type="file" id="csvFile" accept=".csv">
<button onclick="window.print()">Print Labels</button>
</div>

<div class="section">
<h3>Packing Summary</h3>
<div id="summary"></div>
</div>

<div class="section">
<h3>Labels</h3>
<div id="labels"></div>
</div>

<script>

let data = [];
let items = {};

// CSV Load

document.getElementById('csvFile').addEventListener('change', function(e){
 const reader = new FileReader();
 reader.onload = function(e){
   data = parseCSV(e.target.result);
   detectItems();
   calculateTotals();
 };
 reader.readAsText(e.target.files[0]);
});

// CSV parser
function parseCSV(text){
 const lines = text.split('\n').filter(l=>l.trim());
 const headers = lines[0].split(',');

 return lines.slice(1).map(line=>{
   const values = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
   let obj = {};
   headers.forEach((h,i)=> obj[h.trim()] = values?.[i]?.replace(/"/g,'').trim() || '');
   return obj;
 });
}

// 🔥 Extract item details (supports ₹130/kg OR ₹130/piece)
function extractItemDetails(header) {

  let price = 0;
  let unit = "kg";
  let en = "";
  let te = "";

  // normalize header
  const h = header.toLowerCase();

  // detect price patterns
  let match = header.match(/₹\s*(\d+)\s*\/\s*kg/i);
  if (match) {
    price = parseFloat(match[1]);
    unit = "kg";
  }

  match = header.match(/₹\s*(\d+)\s*\/\s*piece/i);
  if (match) {
    price = parseFloat(match[1]);
    unit = "piece";
  }

  // fallback (old format without ₹ symbol)
  match = header.match(/(\d+)\s*\/\s*kg/i);
  if (!price && match) {
    price = parseFloat(match[1]);
    unit = "kg";
  }

  match = header.match(/(\d+)\s*\/\s*piece/i);
  if (!price && match) {
    price = parseFloat(match[1]);
    unit = "piece";
  }

  // extract names
  const parts = header.split('–');

  en = parts[0].split('(')[0].trim();

  if (parts.length > 1) {
    te = parts[1].split('(')[0].trim();
  }

  // name cleanup
  const parts = header.split('–');

  en = parts[0].split('(')[0].split('/')[0].trim();

  if (parts.length > 1) {
    const teluguPart = parts[1].split('(')[0];
    const teluguParts = teluguPart.split('/');
    te = teluguParts[teluguParts.length - 1].trim();
  }

  return { en, te, price, unit };
}

// detect items
function detectItems(){

 items = {};

 data.forEach(row=>{
   Object.keys(row).forEach(k=>{

     if (!["Name","Mobile Number","Apartment No/Area / Location","Timestamp","Notes"].includes(k)) {

       if (row[k]) {
         if (!items[k]) items[k] = extractItemDetails(k);
       }

     }

   });
 });
}

// parse qty
// parse quantity with smart handling
function parseQty(q, unit, itemName) {

 if (!q) return { qty: 0, unitType: unit };

 q = q.toString().toLowerCase().trim();

 // detect explicit units
 if (q.includes("kg")) {
   return { qty: parseFloat(q), unitType: "kg" };
 }

 if (q.includes("g")) {
   return { qty: parseFloat(q)/1000, unitType: "kg" };
 }

 // plain number case
 let num = parseFloat(q) || 0;

 // 🔥 Smart logic: if header is kg but user entered small integer (1-5)
 // assume pieces (common for capsicum, brinjal etc.)
 if (unit === "kg" && Number.isInteger(num) && num > 0 && num <= 5) {

   const pieceItems = ["capsicum","brinjal","tomato","onion"];

   if (pieceItems.some(name => itemName.toLowerCase().includes(name))) {
     return { qty: num, unitType: "piece" };
   }
 }

 // default
 return { qty: num, unitType: unit };
}


// calculate totals
function calculateTotals(){

 let summary = {};
 let html = "<table border='1'><tr><th>Item</th><th>Total</th><th>Rate</th></tr>";

 Object.keys(items).forEach(k=> summary[k]=0);

 data.forEach(row=>{
   Object.keys(items).forEach(k=>{
     const item = items[k];
     const parsed = parseQty(row[k], item.unit, item.en);
     summary[k] += parsed.qty;
   });
 });

 Object.keys(summary).forEach(k=>{

   const item = items[k];
   const unitText = item.unit === "piece" ? "pcs" : "kg";

   html += `<tr>
     <td>${item.en} / ${item.te}</td>
     <td>${summary[k].toFixed(2)} ${unitText}</td>
     <td>₹${item.price}/${item.unit}</td>
   </tr>`;
 });

 html += "</table>";

 document.getElementById("summary").innerHTML = html;

 generateLabels();
}

// labels
function generateLabels(){

 const container = document.getElementById("labels");
 container.innerHTML = "";

 data.forEach(row=>{

   let div = document.createElement("div");
   div.className = "label";

   let itemsHTML = "";
   let total = 0;

   Object.keys(items).forEach(k=>{

     if (row[k]) {

       const item = items[k];
       const parsed = parseQty(row[k], item.unit, item.en);
       const qty = parsed.qty;
       const unitType = parsed.unitType;
       let amount = 0;
       if (unitType === "piece") {
         // assume avg 150g per piece if original price is per kg
         if (item.unit === "kg") {
           const avgWeight = 0.15; // kg per piece
           amount = Math.round(qty * avgWeight * item.price);
         } else {
           amount = Math.round(qty * item.price);
         }
       } else {
         amount = Math.round(qty * item.price);
       }

       total += amount;

       itemsHTML += `
         <div>
           ${item.en} ${item.te ? '/ '+item.te : ''}<br>
           ${row[k]} × ₹${item.price}/${unitType} = ₹${amount}
         </div>
       `;
     }

   });

   div.innerHTML = `
     <b>🌱 Soil & Soul</b><br>
     ${row["Name"]}<br>
     ${row["Apartment No/Area / Location"]}<br>
     📞 ${row["Mobile Number"]}
     <hr>
     ${itemsHTML}
     <hr>
     <b>Total: ₹${total}</b>
   `;

   container.appendChild(div);
 });
}

</script>

</body>
</html>
