<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Soil & Soul Order Processing</title>

<style>
body { font-family: Arial; margin:20px; }
h1 { color:#2e7d32; }

.section { margin-bottom:20px; }

.label {
  border:2px solid #2e7d32;
  padding:10px;
  margin:5px;
  width:260px;
}

#labels {
  display:flex;
  flex-wrap:wrap;
}
</style>

</head>

<body>

<h1>🌱 Soil & Soul Order Tool</h1>

<div class="section">
<select id="community">
  <option value="">Select Community</option>
  <option value="sangeeth">Concrete Sangeeth</option>
</select>

<button onclick="loadData()">Load Orders</button>
</div>

<div class="section">
<h3 id="userInfo"></h3>
</div>

<div class="section">
<h3>Packing Summary</h3>
<div id="summary"></div>
</div>

<div class="section">
<h3>Labels</h3>
<button onclick="window.print()">Print</button>
<div id="labels"></div>
</div>

<script>

const communities = {
  "sangeeth": {
    name: "Concrete Sangeeth",
    url: "https://script.google.com/macros/s/AKfycbzxdgqBKNKekTeXqwJENLSn1nqKglfrnUontla9RAiQgfO5sQJvxSd10abNOvkihqwA/exec"
  }
};

let data = [];
let items = {};

async function loadData() {

  const key = document.getElementById("community").value;
  if (!key) return alert("Select community");

  const community = communities[key];

  const res = await fetch(community.url);
  const result = await res.json();

  if (result.error) {
    alert(result.error);
    return;
  }

  document.getElementById("userInfo").innerText = "Logged in as: " + result.user;

  data = result.data;

  detectItems();
  calculateTotals();
}

// 🔥 UPDATED: extract price + type (kg or piece)
function extractItemDetails(header) {

  let price = 0;
  let unit = "kg"; // default
  let en = "";
  let te = "";

  // detect per kg
  const kgMatch = header.match(/(\d+)\s*\/\s*kg/i);
  if (kgMatch) {
    price = parseFloat(kgMatch[1]);
    unit = "kg";
  }

  // detect per piece
  const pieceMatch = header.match(/(\d+)\s*\/\s*piece/i);
  if (pieceMatch) {
    price = parseFloat(pieceMatch[1]);
    unit = "piece";
  }

  // extract names
  const parts = header.split('–');

  en = parts[0].split('(')[0].trim();

  if (parts.length > 1) {
    te = parts[1].split('(')[0].trim();
  }

  return { en, te, price, unit };
}

function detectItems() {

  items = {};

  data.forEach(row => {
    Object.keys(row).forEach(k => {

      if (!["Name","Mobile Number","Apartment No/Area / Location","Timestamp","Notes"].includes(k)) {

        if (row[k]) {
          if (!items[k]) items[k] = extractItemDetails(k);
        }

      }

    });
  });
}

// 🔥 UPDATED: quantity parser supports kg + g + piece count
function parseQty(q, unit) {

  if (!q) return 0;

  q = q.toLowerCase();

  if (unit === "piece") {
    return parseFloat(q); // direct count
  }

  // kg items
  if (q.includes("kg")) return parseFloat(q);
  if (q.includes("g")) return parseFloat(q)/1000;

  return parseFloat(q) || 0;
}

function calculateTotals() {

  let summary = {};

  let html = "<table border='1'><tr><th>Item</th><th>Total</th><th>Rate</th></tr>";

  Object.keys(items).forEach(k => summary[k] = 0);

  data.forEach(row => {
    Object.keys(items).forEach(k => {
      const item = items[k];
      summary[k] += parseQty(row[k], item.unit);
    });
  });

  Object.keys(summary).forEach(k => {

    const item = items[k];

    const unitText = item.unit === "piece" ? "pcs" : "kg";

    html += `<tr>
      <td>${item.en} / ${item.te}</td>
      <td>${summary[k].toFixed(2)} ${unitText}</td>
      <td>₹${item.price}/${item.unit}</td>
    </tr>`;
  });

  html += "</table>";

  document.getElementById("summary").innerHTML = html;

  generateLabels();
}

function generateLabels() {

  const container = document.getElementById("labels");
  container.innerHTML = "";

  data.forEach(row => {

    let div = document.createElement("div");
    div.className = "label";

    let itemsHTML = "";
    let total = 0;

    Object.keys(items).forEach(k => {

      if (row[k]) {

        const item = items[k];
        const qty = parseQty(row[k], item.unit);

        const amount = Math.round(qty * item.price);

        total += amount;

        const unitText = item.unit === "piece" ? "pcs" : item.unit;

        itemsHTML += `
          <div>
            ${item.en} / ${item.te}<br>
            ${row[k]} × ₹${item.price}/${item.unit} = ₹${amount}
          </div>
        `;
      }

    });

    div.innerHTML = `
      <b>🌱 Soil & Soul</b><br>
      ${row["Name"]}<br>
      ${row["Apartment No/Area / Location"]}<br>
      📞 ${row["Mobile Number"]}
      <hr>
      ${itemsHTML}
      <hr>
      <b>Total: ₹${total}</b>
    `;

    container.appendChild(div);
  });
}

</script>

</body>
</html>
