<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Soil & Soul Order Processing</title>

<style>
body { font-family: Arial; margin:20px; }
h1 { color:#2e7d32; }
.section { margin-bottom:20px; }
.label {
  border:2px solid #2e7d32;
  padding:10px;
  margin:5px;
  width:260px;
}
#labels { display:flex; flex-wrap:wrap; }
table { border-collapse: collapse; }
th, td { padding:6px; border:1px solid #ccc; }
</style>
</head>

<body>

<h1>🌱 Soil & Soul Order Tool 5 </h1>

<div class="section">
<input type="file" id="csvFile" accept=".csv">
<button onclick="window.print()">Print Labels</button>
</div>

<div class="section">
<h3>Packing Summary</h3>
<div id="summary"></div>
</div>

<div class="section">
<h3>Labels</h3>
<div id="labels"></div>
</div>

<script>

let data = [];
let items = {};

// ================= CSV LOAD =================
document.getElementById('csvFile').addEventListener('change', function(e){
  const reader = new FileReader();
  reader.onload = function(e){
    data = parseCSV(e.target.result);
    detectItems();
    calculateTotals();
  };
  reader.readAsText(e.target.files[0]);
});

// ================= PROPER CSV PARSER =================
function parseCSV(text){

  text = text.replace(/\r/g, "");

  const lines = text.split("\n").filter(l => l.trim());

  const headers = lines[0]
    .match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
    .map(h => h.replace(/"/g, '').trim());

  return lines.slice(1).map(line => {

    const values = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];

    let obj = {};

    headers.forEach((h, i) => {
      obj[h] = values[i] ? values[i].replace(/"/g, '').trim() : "";
    });

    return obj;
  });
}

// ================= VALIDATION =================
function isValidValue(v) {
  return v && v !== "NaN" && v !== "null" && v.trim() !== "";
}

// ================= EXTRACT ITEM =================
function extractItemDetails(header) {

  let price = 0;
  let unit = "kg";
  let en = "";
  let te = "";

  let match = header.match(/₹\s*(\d+)\s*\/\s*kg/i);
  if (match) { price = parseFloat(match[1]); unit = "kg"; }

  match = header.match(/₹\s*(\d+)\s*\/\s*piece/i);
  if (match) { price = parseFloat(match[1]); unit = "piece"; }

  match = header.match(/(\d+)\s*\/\s*kg/i);
  if (!price && match) { price = parseFloat(match[1]); unit = "kg"; }

  match = header.match(/(\d+)\s*\/\s*piece/i);
  if (!price && match) { price = parseFloat(match[1]); unit = "piece"; }

  const parts = header.split('–');
  en = parts[0].split('(')[0].split('/')[0].trim();

  if (parts.length > 1) {
    const teluguPart = parts[1].split('(')[0];
    const teluguParts = teluguPart.split('/');
    te = teluguParts[teluguParts.length - 1].trim();
  }

  return { en, te, price, unit };
}

// ================= DETECT ITEMS =================
function detectItems(){
  items = {};

  data.forEach(row=>{
    Object.keys(row).forEach(k=>{
      if (!["Name","Mobile Number","Apartment No/Area / Location","Timestamp","Notes"].includes(k)) {
        if (isValidValue(row[k])) {
          if (!items[k]) items[k] = extractItemDetails(k);
        }
      }
    });
  });
}

// ================= STRICT QUANTITY PARSE =================
function parseQty(raw, unit){

  if (!isValidValue(raw)) return 0;

  raw = raw.toString().toLowerCase().trim();

  if (unit === "piece") {
    let num = parseFloat(raw);
    return isNaN(num) ? 0 : num;
  }

  if (raw.includes("kg")) {
    let num = parseFloat(raw);
    return isNaN(num) ? 0 : num;
  }

  if (raw.includes("g")) {
    let num = parseFloat(raw);
    return isNaN(num) ? 0 : num / 1000;
  }

  return 0; // strict mode
}

// ================= CALCULATE SUMMARY =================
function calculateTotals(){

  let summary = {};

  Object.keys(items).forEach(k=> summary[k] = 0);

  data.forEach(row=>{
    Object.keys(items).forEach(k=>{
      const item = items[k];
      const qty = parseQty(row[k], item.unit);
      if (!isNaN(qty)) summary[k] += qty;
    });
  });

  let html = "<table><tr><th>Item</th><th>Total</th><th>Rate</th></tr>";

  Object.keys(summary).forEach(k=>{

    const item = items[k];
    const totalQty = summary[k];

    if (totalQty === 0) return;

    const unitText = item.unit === "piece" ? "pcs" : "kg";

    html += `<tr>
      <td>${item.en} ${item.te ? '/ '+item.te : ''}</td>
      <td>${totalQty.toFixed(2)} ${unitText}</td>
      <td>₹${item.price}/${item.unit}</td>
    </tr>`;
  });

  html += "</table>";

  document.getElementById("summary").innerHTML = html;

  generateLabels();
}

// ================= LABELS =================
function generateLabels(){

  const container = document.getElementById("labels");
  container.innerHTML = "";

  data.forEach(row=>{

    let div = document.createElement("div");
    div.className = "label";

    let itemsHTML = "";
    let total = 0;

    Object.keys(items).forEach(k=>{

      const item = items[k];
      const qty = parseQty(row[k], item.unit);

      if (qty === 0) return;

      const amount = Math.round(qty * item.price);
      total += amount;

      itemsHTML += `
        <div>
          ${item.en} ${item.te ? '/ '+item.te : ''}<br>
          ${row[k]} × ₹${item.price}/${item.unit} = ₹${amount}
        </div>
      `;
    });

    if (!itemsHTML) return;

    div.innerHTML = `
      <b>🌱 Soil & Soul</b><br>
      ${row["Name"]}<br>
      ${row["Apartment No/Area / Location"]}<br>
      📞 ${row["Mobile Number"]}
      <hr>
      ${itemsHTML}
      <hr>
      <b>Total: ₹${total}</b>
    `;

    container.appendChild(div);
  });
}

</script>

</body>
</html>
