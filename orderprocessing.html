<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Soil & Soul Order Processing - Concrete Sangeeth</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { font-family: Arial; margin:20px; }
h1 { color:#2e7d32; }
.section { margin-bottom:20px; }
.label {
  border:2px solid #2e7d32;
  padding:10px;
  margin:5px;
  width:280px;
  page-break-inside: avoid;
}
#labels { display:flex; flex-wrap:wrap; }
table { border-collapse: collapse; width:100%; }
th, td { padding:6px; border:1px solid #ccc; text-align:left; }
th { cursor:pointer; background:#f2f2f2; }
.debug { font-size: 12px; color: #666; }
</style>
</head>

<body>

<h1>🌱 Soil & Soul Order Tool  processing tool 12 </h1>

<div class="section">
<input type="file" id="csvFile" accept=".csv">
<button onclick="window.print()">Print Labels</button>
<button onclick="debugItems()">Debug Items</button>
</div>

<div class="section">
<h3>Packing Summary (Click Total to Sort)</h3>
<div id="summary"></div>
</div>

<div class="section">
<h3>Individual Order Labels</h3>
<div id="labels"></div>
</div>

<script>

let data = [];
let items = {};
let currentRows = [];
let sortDesc = true;

// ================= LOAD CSV =================
document.getElementById('csvFile').addEventListener('change', function(e){
  Papa.parse(e.target.files[0], {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      data = results.data;
      detectItems();
      calculateTotals();
    }
  });
});

// ================= VALIDATION =================
function isValidValue(v) {
  return v && v !== "NaN" && v !== "null" && v.trim() !== "";
}

// ================= EXTRACT ITEM FROM YOUR CSV HEADERS =================
function extractItemDetails(header) {
  let price = 0;
  let unit = "kg";
  let en = "";
  let te = "";

  // Your CSV headers are like: "Lettuce – (₹45/bunch)", "Bachali –   (₹30/bunch)", "Lemon /నిమ్మకాయ unit 6 pieces  (₹40/unit)"
  const priceMatch = header.match(/₹(\d+(?:\.\d+)?)\/(\w+)/i);
  if (priceMatch) {
    price = parseFloat(priceMatch[1]);
    const unitLower = priceMatch[2].toLowerCase();
    if (["kg", "piece", "bunch", "unit"].includes(unitLower)) {
      unit = unitLower;
    }
  }

  // Extract English name (before '–' or '(')
  const cleanHeader = header.replace(/\(.*?\)$/, '').trim(); // remove price part
  const parts = cleanHeader.split('–');
  en = parts[0].trim();
  
  // Telugu name (after '–')
  if (parts.length > 1) {
    const teluguPart = parts[1].trim().split('/')[0].trim();
    te = teluguPart;
  }

  return { en, te, price, unit };
}

// ================= DETECT ITEMS =================
function detectItems(){
  items = {};
  data.forEach(row=>{
    Object.keys(row).forEach(k=>{
      if (!["Timestamp", "Name", "Mobile Number", "Apartment No/Area / Location", "Notes"].includes(k)) {
        if (isValidValue(row[k])) {
          if (!items[k]) {
            items[k] = extractItemDetails(k);
            console.log(`Detected: "${k}" →`, items[k]); // DEBUG
          }
        }
      }
    });
  });
}

// ================= PARSE QTY FROM CELLS =================
function parseQty(raw) {
  if (!isValidValue(raw)) return 0;
  raw = raw.toString().toLowerCase().trim();

  // Handle g → kg conversion
  if (raw.includes('g')) {
    const num = parseFloat(raw.replace(/[^0-9.]/g, ''));
    return num ? num / 1000 : 0;
  }

  // Handle kg, bunch, unit, piece
  if (raw.includes('kg') || raw.includes('bunch') || raw.includes('bunches') || 
      raw.includes('unit') || raw.includes('units') || raw.includes('piece')) {
    const num = parseFloat(raw.replace(/[^0-9.]/g, ''));
    return num ? num : 0;
  }

  // Plain numbers
  const num = parseFloat(raw.replace(/[^0-9.]/g, ''));
  return num ? num : 0;
}

// ================= CALCULATE TOTALS =================
function calculateTotals(){
  let summary = {};
  Object.keys(items).forEach(k=> summary[k] = 0);

  data.forEach(row=>{
    Object.keys(items).forEach(k=>{
      const qty = parseQty(row[k]);
      summary[k] += qty;
    });
  });

  currentRows = Object.keys(summary)
    .map(k => ({
      key: k,
      item: items[k],
      qty: summary[k]
    }))
    .filter(r => r.qty > 0)
    .sort((a,b) => b.qty - a.qty);

  renderSummary();
  generateLabels();
}

// ================= RENDER SUMMARY TABLE =================
function renderSummary(){
  let html = "<table><tr><th>Item</th><th onclick='toggleSort()' style='cursor:pointer'>Total ⬍</th><th>Rate</th></tr>";

  const unitMap = {
    kg: "kg", piece: "pcs", bunch: "bunch", unit: "unit"
  };

  currentRows.forEach(r=>{
    const unitText = unitMap[r.item.unit] || r.item.unit;
    html += `<tr>
      <td>${r.item.en}${r.item.te ? ' – ' + r.item.te : ''}</td>
      <td><b>${r.qty.toFixed(2)} ${unitText}</b></td>
      <td>₹${r.item.price}/${r.item.unit}</td>
    </tr>`;
  });

  html += "</table>";
  document.getElementById("summary").innerHTML = html;
}

function toggleSort(){
  sortDesc = !sortDesc;
  currentRows.sort((a,b)=> sortDesc ? b.qty - a.qty : a.qty - b.qty);
  renderSummary();
}

// ================= GENERATE PRINTABLE LABELS =================
function generateLabels(){
  const container = document.getElementById("labels");
  container.innerHTML = "";

  data.forEach(row=>{
    let itemsHTML = "";
    let total = 0;

    Object.keys(items).forEach(k=>{
      const item = items[k];
      const qty = parseQty(row[k]);
      if (qty === 0) return;

      const amount = Math.round(qty * item.price * 1000) / 1000; // kg precision
      total += amount;

      itemsHTML += `
        <div style="margin:2px 0;">
          ${item.en}${item.te ? ' – ' + item.te : ''}<br>
          <small>${qty.toFixed(2)} × ₹${item.price}/${item.unit} = ₹${amount.toFixed(0)}</small>
        </div>
      `;
    });

    if (!itemsHTML) return;

    const div = document.createElement("div");
    div.className = "label";
    div.innerHTML = `
      <b>🌱 Soil & Soul Farms</b><br>
      <b>${row["Name"] || "Customer"}</b><br>
      ${row["Apartment No/Area / Location"] || ""}<br>
      📞 ${row["Mobile Number"] || ""}<br>
      <hr style="margin:8px 0;">
      ${itemsHTML}
      <hr style="margin:8px 0;">
      <b style="font-size:18px;">Total: ₹${total.toFixed(0)}</b>
    `;
    container.appendChild(div);
  });
}

// ================= DEBUG FUNCTION =================
function debugItems(){
  console.table(Object.keys(items).map(k => ({
    header: k,
    ...items[k],
    sample: data[0][k] || ""
  })));
  alert("Check browser Console (F12) for detected items!");
}

</script>

</body>
</html>
