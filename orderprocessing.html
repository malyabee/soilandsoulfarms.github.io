<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soil & Soul Order Processing</title>

<style>
body { font-family: Arial; margin:20px; background:#f4f6f5; }
h1 { color:#2e7d32; }
.section { background:#fff; padding:15px; margin-bottom:15px; border-radius:8px; }
button { background:#2e7d32; color:#fff; border:none; padding:8px 12px; margin:5px; cursor:pointer; }

#labels { display:flex; flex-wrap:wrap; gap:10px; }
.label { width:260px; border:2px solid #2e7d32; padding:10px; border-radius:8px; background:#fff; }

#summary table { width:100%; border-collapse:collapse; }
#summary th, #summary td { border:1px solid #ddd; padding:6px; }

.item-line { font-size:13px; margin-bottom:4px; }
.small { font-size:12px; color:#555; }

</style>
</head>

<body>
<h1>🌱 Soil & Soul Order Tool</h1>

<div class="section">
<h3>Upload CSV</h3>
<input type="file" id="csvFile" accept=".csv">
<div class="small">Auto reads price & Telugu names from column headers</div>
</div>

<div class="section">
<h3>Packing Summary</h3>
<div id="summary"></div>
</div>

<div class="section">
<h3>Labels</h3>
<button onclick="printLabels()">Print Labels</button>
<div id="labels"></div>
</div>

<script>
let data = [];
let items = {}; // { key: { en, te, price } }

// CSV Load

document.getElementById('csvFile').addEventListener('change', function(e){
 const reader = new FileReader();
 reader.onload = function(e){
   data = parseCSV(e.target.result);
   detectItems();
   calculateTotals();
 };
 reader.readAsText(e.target.files[0]);
});

function parseCSV(text){
 const lines = text.split('\n').filter(l=>l.trim());
 const headers = lines[0].split(',');
 return lines.slice(1).map(line=>{
   const values = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
   let obj = {};
   headers.forEach((h,i)=> obj[h.trim()] = values?.[i]?.replace(/"/g,'').trim() || '');
   return obj;
 });
}

// 🔥 Extract English, Telugu, Price
function extractItemDetails(header){
 let price = 0;
 let en = '';
 let te = '';

 // price (120/kg)
 const priceMatch = header.match(/(\d+)\s*\/\s*kg/);
 if(priceMatch) price = parseFloat(priceMatch[1]);

 // split telugu part
 const parts = header.split('–');

 // English name (before first bracket)
 en = parts[0].split('(')[0].trim();

 // Telugu name (after – and before bracket)
 if(parts.length > 1){
   te = parts[1].split('(')[0].trim();
 }

 return { en, te, price };
}

// detect items
function detectItems(){
 items = {};
 data.forEach(row=>{
   Object.keys(row).forEach(k=>{
     if(!["Name","Mobile Number","Apartment No/Area / Location","Timestamp","Notes"].includes(k)){
       if(row[k]){
         if(!items[k]) items[k] = extractItemDetails(k);
       }
     }
   });
 });
}

// quantity convert
function parseQty(qtyStr){
 if(!qtyStr) return 0;
 qtyStr = qtyStr.toLowerCase();

 if(qtyStr.includes('kg')) return parseFloat(qtyStr);
 if(qtyStr.includes('g')) return parseFloat(qtyStr)/1000;

 return parseFloat(qtyStr) || 0;
}

// summary + billing
function calculateTotals(){
 let summary = {};
 let html = "<table><tr><th>Item</th><th>Total Qty (kg)</th><th>Rate</th></tr>";

 Object.keys(items).forEach(k=> summary[k]=0);

 data.forEach(row=>{
   Object.keys(items).forEach(k=>{
     summary[k] += parseQty(row[k]);
   });
 });

 Object.keys(summary).forEach(k=>{
   const item = items[k];
   html += `<tr><td>${item.en} / ${item.te}</td><td>${summary[k].toFixed(2)}</td><td>₹${item.price}</td></tr>`;
 });

 html += "</table>";
 document.getElementById('summary').innerHTML = html;

 generateBills();
}

// billing
function generateBills(){
 data.forEach(row=>{
   let total = 0;

   Object.keys(items).forEach(k=>{
     let qtyKg = parseQty(row[k]);
     let price = items[k].price || 0;
     total += qtyKg * price;
   });

   row.total = Math.round(total);
 });

 generateLabels();
}

// labels with price per item
function generateLabels(){
 const container = document.getElementById('labels');
 container.innerHTML='';

 data.forEach(row=>{
   let div = document.createElement('div');
   div.className='label';

   let itemsHTML='';

   Object.keys(items).forEach(k=>{
     if(row[k]){
       const item = items[k];
       const qtyKg = parseQty(row[k]);
       const price = item.price;
       const amount = Math.round(qtyKg * price);

       itemsHTML += `
         <div class="item-line">
           ${item.en} ${item.te ? '/ '+item.te : ''}<br>
           <span class="small">${row[k]} × ₹${price} = ₹${amount}</span>
         </div>`;
     }
   });

   div.innerHTML = `
   <b>🌱 Soil & Soul</b><br>
   ${row['Name']}<br>
   ${row['Apartment No/Area / Location']}<br>
   📞 ${row['Mobile Number']}<br><hr>
   ${itemsHTML}
   <hr>
   <b>Total: ₹${row.total || 0}</b>
   `;

   container.appendChild(div);
 });
}

function printLabels(){ window.print(); }
</script>

</body>
</html>
