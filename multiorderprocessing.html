<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Soil & Soul Order Tool</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

h1 {
    color: #2e7d32;
}

button {
    padding: 6px 12px;
    margin-left: 10px;
    cursor: pointer;
}

.section {
    margin-top: 40px;
}

.summary-box {
    border: 1px solid #ccc;
    padding: 15px;
    margin-top: 15px;
    background: #f9f9f9;
}

.total-box {
    font-size: 18px;
    font-weight: bold;
    color: #1b5e20;
    margin-bottom: 20px;
}

.label-box {
    border: 2px solid #2e7d32;
    padding: 15px;
    margin: 20px 0;
}

hr {
    margin: 40px 0;
}
</style>
</head>

<body>

<h1>🌱 Soil & Soul Order Tool</h1>

<input type="file" id="csvFiles" accept=".csv" multiple>
<button onclick="addAnotherFile()">Add Another CSV</button>
<button onclick="processAllCSVs()">Process Orders</button>
<button onclick="printLabels()">Print Labels</button>

<div id="extraFileInputs"></div>

<div class="section">
    <h2>Combined Packing Summary</h2>
    <div id="combinedSummary" class="summary-box"></div>
</div>

<hr>

<div class="section">
    <h2>Individual Community Summaries</h2>
    <div id="individualSummaries"></div>
</div>

<script>

function addAnotherFile() {
    const container = document.getElementById("extraFileInputs");
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".csv";
    input.className = "extraCsv";
    container.appendChild(document.createElement("br"));
    container.appendChild(input);
}

function processAllCSVs() {

    const mainInput = document.getElementById('csvFiles');
    const extraInputs = document.querySelectorAll('.extraCsv');

    let allFiles = [];

    if (mainInput.files.length > 0) {
        allFiles = Array.from(mainInput.files);
    }

    extraInputs.forEach(input => {
        if (input.files.length > 0) {
            allFiles.push(input.files[0]);
        }
    });

    if (allFiles.length === 0) {
        alert("Please select at least one CSV file.");
        return;
    }

    let combinedData = {};
    let individualSummaries = [];
    let filesProcessed = 0;

    allFiles.forEach(file => {

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {

                let individualData = {};

                results.data.forEach(row => {

                    Object.keys(row).forEach(header => {

                        if (
                            header.includes("Timestamp") ||
                            header.includes("Name") ||
                            header.includes("Mobile") ||
                            header.includes("Location") ||
                            header.includes("Notes") ||
                            header.toLowerCase().includes("termaric") ||
                            header.toLowerCase().includes("rice")
                        ) return;

                        let value = row[header];
                        if (!value) return;

                        value = value.toString().trim();
                        if (value === "") return;

                        let qty = 0;
                        let unit = "kg";

                        if (value.toLowerCase().includes("g")) {
                            qty = parseFloat(value.replace("g","")) / 1000;
                            unit = "kg";
                        }
                        else if (value.toLowerCase().includes("kg")) {
                            qty = parseFloat(value.replace("kg",""));
                            unit = "kg";
                        }
                        else if (!isNaN(value)) {
                            qty = parseFloat(value);
                            unit = header.toLowerCase().includes("piece") ? "pcs" : "pcs";
                        } else {
                            return;
                        }

                        if (isNaN(qty) || qty <= 0) return;

                        const cleanItem = header
                            .replace(/\(.*?\)/g, "")
                            .replace(/[–—]/g, "")
                            .replace(/"/g, "")
                            .trim();

                        const key = cleanItem + "|" + unit;

                        if (!combinedData[key]) {
                            combinedData[key] = { item: cleanItem, qty: 0, unit };
                        }
                        combinedData[key].qty += qty;

                        if (!individualData[key]) {
                            individualData[key] = { item: cleanItem, qty: 0, unit };
                        }
                        individualData[key].qty += qty;

                    });

                });

                individualSummaries.push({
                    fileName: file.name,
                    data: individualData
                });

                filesProcessed++;

                if (filesProcessed === allFiles.length) {
                    renderCombinedSummary(combinedData);
                    renderIndividualSummaries(individualSummaries);
                }

            }
        });

    });
}

function renderCombinedSummary(data) {

    let kgItems = [];
    let pcsItems = [];

    let totalKg = 0;
    let totalPcs = 0;

    Object.values(data).forEach(entry => {
        if (entry.unit === "kg") {
            if (entry.qty > 0.01) {
                kgItems.push(entry);
                totalKg += entry.qty;
            }
        } else {
            if (entry.qty > 0) {
                pcsItems.push(entry);
                totalPcs += entry.qty;
            }
        }
    });

    kgItems.sort((a,b) => b.qty - a.qty);
    pcsItems.sort((a,b) => b.qty - a.qty);

    let output = "";

    output += `<div class="total-box">
                Total Combined Weight: ${totalKg.toFixed(2)} kg<br>
                Total Combined Pieces: ${totalPcs} pcs
               </div>`;

    output += "<strong>KG Items</strong><br><br>";

    kgItems.forEach(i => {
        output += `${i.item} - ${i.qty.toFixed(2)} kg<br>`;
    });

    output += "<br><strong>PCS Items</strong><br><br>";

    pcsItems.forEach(i => {
        output += `${i.item} - ${i.qty.toFixed(0)} pcs<br>`;
    });

    document.getElementById("combinedSummary").innerHTML = output;
}

function renderIndividualSummaries(summaries) {

    let container = document.getElementById("individualSummaries");
    container.innerHTML = "";

    summaries.forEach(summary => {

        let kgItems = [];
        let pcsItems = [];

        Object.values(summary.data).forEach(entry => {
            if (entry.unit === "kg" && entry.qty > 0.01) kgItems.push(entry);
            if (entry.unit === "pcs" && entry.qty > 0) pcsItems.push(entry);
        });

        kgItems.sort((a,b) => b.qty - a.qty);
        pcsItems.sort((a,b) => b.qty - a.qty);

        let block = `<div class="label-box">`;
        block += `<h3>${summary.fileName}</h3>`;

        block += "<strong>KG Items</strong><br>";
        kgItems.forEach(i => {
            block += `${i.item} - ${i.qty.toFixed(2)} kg<br>`;
        });

        block += "<br><strong>PCS Items</strong><br>";
        pcsItems.forEach(i => {
            block += `${i.item} - ${i.qty.toFixed(0)} pcs<br>`;
        });

        block += `</div>`;

        container.innerHTML += block;
    });
}

function printLabels() {
    window.print();
}

</script>

</body>
</html>
